name: Build prime kernel

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload release'
        type: boolean
        required: true
        default: false
      changelog:
        description: 'Changelog'
        type: string
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: |
          RELEASE_TS=$(date +'%Y%m%d-%H%M%S')
          echo "release_ts=$RELEASE_TS" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        device: [ y2q, x1q, c1q, c2q, z3q ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      - name: Build kernel
        run: |
          chmod +x build_prime.sh
          bash build_prime.sh "${{ matrix.device }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PrimeKernel-${{ matrix.device }}-${{ needs.prepare.outputs.release_ts }}
          path: |
            AnyKernel3/
            images/

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Zip build artifacts
        run: |
          cd artifacts
          for dir in PrimeKernel-*; do
            (
              cd "$dir"
              zip -r "../${dir}.zip" .
            )
          done

  release:
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event.inputs.release == 'true' }}
    steps:
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: ${{ github.event.inputs.changelog }}
